<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Material Design Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="llama-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Material Shadows -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base (Material Squircle with Elevation) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" filter="url(#drop-shadow)" />

  <!-- Subtle Inner Ring Accent -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Stylized Llama Head & Tech Nodes (Material Icon Layer) -->
  <g filter="url(#icon-shadow)">
    <!-- Back Ear -->
    <path d="M 242 108 C 238 68 270 58 280 98 L 290 152 Z" fill="#E0E7FF" opacity="0.85" />

    <!-- Front Ear -->
    <path d="M 188 122 C 178 82 212 72 222 112 L 236 162 Z" fill="url(#llama-body)" />
    <!-- Inner Ear Accent -->
    <path d="M 198 126 C 192 100 210 92 216 116 L 225 152 Z" fill="url(#accent-grad)" opacity="0.6" />

    <!-- Head, Neck & Snout Silhouette -->
    <path d="M 225 152 
             L 322 182 
             Q 348 192 348 218 
             Q 348 244 318 258 
             L 282 268 
             L 282 338 
             Q 282 368 252 388 
             L 192 388 
             Q 162 368 162 328 
             L 162 232 
             Q 162 172 225 152 Z" 
          fill="url(#llama-body)" />

    <!-- Eye (Material Primary Color Cutout) -->
    <circle cx="282" cy="206" r="14" fill="#4F46E5" />
    <circle cx="286" cy="202" r="5" fill="#FFFFFF" />

    <!-- Snout Line -->
    <path d="M 328 226 C 318 241 298 243 288 236" fill="none" stroke="#4F46E5" stroke-width="5" stroke-linecap="round" />

    <!-- AI Neural Circuit Traces on Llama Neck (llama.cpp integration motif) -->
    <g stroke="#6366F1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
      <line x1="192" y1="272" x2="236" y2="272" />
      <line x1="236" y1="272" x2="254" y2="290" />
      <line x1="192" y1="312" x2="220" y2="312" />
      <line x1="220" y1="312" x2="238" y2="330" />
      <line x1="192" y1="352" x2="238" y2="352" />
    </g>
    <!-- Circuit Connection Dots -->
    <circle cx="254" cy="290" r="5" fill="#818CF8" />
    <circle cx="238" cy="330" r="5" fill="#818CF8" />
    <circle cx="238" cy="352" r="5" fill="#818CF8" />
  </g>
</svg>
